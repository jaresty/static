<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LS Clock — Liberating Structures session runner</title>
<link rel="stylesheet" href="vendor/driver.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2d3148;
    --text: #e8eaf6;
    --muted: #7b82b0;
    --accent: #6c8ef5;
    --amber: #f59e0b;
    --red: #ef4444;
    --green: #22c55e;
    --radius: 10px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 1rem;
  }

  .global-navigation {
    align-items: center; display: flex; justify-content: space-between; gap: .75rem;
    max-width: 700px; margin: 0 auto 1rem;
  }
  .global-navigation a {
    align-items: center; border-radius: var(--radius); color: #c6d2ff; display: inline-flex;
    font-size: .9rem; font-weight: 650; min-height: 44px; padding: .55rem .75rem;
    text-decoration: none;
  }
  .global-navigation a:hover, .global-navigation a:focus-visible { background: var(--surface); color: #fff; }
  .global-navigation .start-new-session { background: var(--border); color: var(--text); }
  #app { max-width: 700px; margin: 0 auto; }

  /* ---- Typography ---- */
  .app-title { font-size: 2rem; font-weight: 750; color: var(--accent); margin-bottom: .25rem; letter-spacing: -.02em; }
  .product-intro { margin-bottom: 1.5rem; }
  .product-eyebrow { color: var(--muted); font-size: .8rem; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; }
  .product-tagline { color: var(--text); font-size: 1.125rem; line-height: 1.4; margin-top: .35rem; }
  .clock-explanation {
    background: rgba(108,142,245,.09); border: 1px solid rgba(108,142,245,.28);
    border-radius: var(--radius); margin-top: 1rem; padding: 1rem;
  }
  .clock-explanation h2 { color: #c6d2ff; margin-bottom: .35rem; }
  .clock-explanation p { color: var(--muted); font-size: .9rem; line-height: 1.5; }
  #start-walkthrough-btn { margin-top: .85rem; }
  .driver-popover.ls-clock-tour { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
  .driver-popover.ls-clock-tour .driver-popover-title { color: #c6d2ff; }
  .driver-popover.ls-clock-tour .driver-popover-description { color: var(--muted); line-height: 1.45; }
  .driver-popover.ls-clock-tour button { background: var(--border); color: var(--text); text-shadow: none; }
  .driver-popover.ls-clock-tour .driver-popover-next-btn { background: var(--accent); }
  h2 { font-size: 1rem; font-weight: 600; color: var(--muted); margin-bottom: .5rem; }
  h3 { font-size: .9rem; font-weight: 600; color: var(--muted); margin: .8rem 0 .4rem; }
  .hint { font-size: .85rem; color: var(--muted); margin-bottom: .5rem; }
  code { font-size: .82rem; background: var(--surface); padding: .1rem .3rem; border-radius: 4px; }

  /* ---- Setup ---- */
  .setup-section { margin-bottom: 1.5rem; }
  .manual-form, #preview-section, #result-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
  }
  #llm-toggle-btn { min-height: 44px; }
  .llm-section .assistant-content {
    margin-top: .75rem;
    padding: 1rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .manual-form > summary { cursor: pointer; list-style-position: outside; }
  .manual-form[open] > summary { margin-bottom: 1.25rem; }
  .manual-form > .setup-section {
    margin-bottom: 0;
    padding: 1.25rem 0;
    border-top: 1px solid var(--border);
  }
  .setup-actions, .quick-set-row, .structure-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
  }
  .setup-actions { gap: .75rem; margin-top: 1rem; }
  .quick-set-row { gap: .5rem; margin-bottom: .75rem; }
  .structure-row { gap: .75rem; }
  .structure-row select { flex: 1 1 260px; }
  .structure-row a { white-space: nowrap; }
  [data-role="structure-description"] {
    color: var(--muted);
    flex: 1 0 100%;
    line-height: 1.4;
    margin: .5rem 0 .75rem;
  }
  .structure-break-row {
    display: flex;
    align-items: center;
    gap: .5rem;
    color: var(--muted);
    margin: .75rem 0;
  }
  .structure-break-row + .structure-row { margin-bottom: .75rem; }
  #load-sample-btn { margin-bottom: 1.25rem; }
  #add-structure-btn { margin-top: .75rem; }
  #generate-btn { width: 100%; margin-top: 1.25rem; }
  .fishbowl-role-options { display: grid; gap: .5rem; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
  .fishbowl-role-option {
    align-items: center; background: rgba(15,17,23,.4); border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer; display: flex; gap: .65rem; min-height: 44px;
    padding: .65rem .75rem;
  }
  .fishbowl-role-option:has(input:checked) { border-color: var(--accent); background: rgba(108,142,245,.12); }
  .fishbowl-role-option input { height: 20px; width: 20px; }
  .fishbowl-selection-count { color: var(--muted); font-size: .82rem; margin-top: .6rem; }
  select, input[type="text"], input[type="datetime-local"], textarea {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: .5rem .75rem; border-radius: var(--radius);
    font-size: .95rem; font-family: inherit;
  }
  textarea { resize: vertical; }
  .wide-input { width: 100%; }
  button {
    cursor: pointer; border: none; border-radius: var(--radius);
    min-height: 42px; padding: .5rem 1.2rem; font-size: .95rem; font-family: inherit;
    background: var(--border); color: var(--text);
    transition: background .15s;
  }
  button:hover { background: #3d4270; }
  .primary-btn { background: var(--accent); color: #fff; margin-top: .5rem; }
  .setup-actions .primary-btn { margin-top: 0; }
  .primary-btn:hover { background: #5a7ce6; }
  #session-url-output { font-family: monospace; font-size: .8rem; }
  .url-hint { font-size: .82rem; color: var(--muted); margin-top: .4rem; }
  .copy-confirm { color: var(--green); font-size: .85rem; margin-left: .5rem; }
  .error-msg { color: var(--red); font-size: .85rem; margin-top: .4rem; }

  /* ---- Participant landing ---- */
  .join-screen { padding: 2.5rem 0 4rem; }
  .join-brand { margin-bottom: 1.5rem; }
  .join-brand .app-title { font-size: 2.25rem; }
  .session-hero {
    background: linear-gradient(145deg, #202536, var(--surface));
    border: 1px solid #3a4262;
    border-radius: 20px;
    box-shadow: 0 24px 60px rgba(0,0,0,.28);
    padding: 32px;
  }
  .session-kicker, .session-label {
    color: #aab2dc; font-size: .75rem; font-weight: 700;
    letter-spacing: .09em; text-transform: uppercase;
  }
  .session-title {
    color: var(--text); font-size: 28px; font-weight: 760;
    letter-spacing: -.02em; margin: .3rem 0 1.25rem;
  }
  .invitation {
    font-size: 1.2rem; font-style: italic; color: var(--muted);
    margin: 1rem 0 2rem; line-height: 1.5;
  }
  .invitation-card {
    background: rgba(15,17,23,.55); border: 1px solid var(--border);
    border-radius: 14px; padding: 1rem 1.1rem;
  }
  .invitation-card p { font-size: 1.1rem; line-height: 1.5; margin-top: .35rem; }
  .session-start-guidance {
    color: #dbe2ff; background: rgba(108,142,245,.14);
    border: 1px solid rgba(108,142,245,.35); border-radius: 999px;
    display: inline-flex; margin-top: 1rem; padding: .55rem .85rem;
    font-size: .88rem; font-variant-numeric: tabular-nums;
  }
  .landing-session-details { margin-top: 1.25rem; }
  .landing-session-details summary, .late-arrival summary { cursor: pointer; font-weight: 650; }
  .landing-phase-list { display: grid; gap: .65rem; margin-top: .9rem; }
  .landing-phase {
    background: rgba(15,17,23,.4); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: .75rem .85rem;
  }
  .landing-phase-heading { display: flex; justify-content: space-between; gap: 1rem; }
  .landing-phase-heading span, .landing-phase p { color: var(--muted); font-size: .85rem; }
  .landing-phase p { line-height: 1.4; margin-top: .25rem; }
  .landing-group-list { display: grid; gap: .4rem; margin-top: .65rem; }
  .landing-group {
    align-items: baseline; display: grid; gap: .2rem .65rem;
    grid-template-columns: auto 1fr auto; padding-top: .4rem;
    border-top: 1px solid rgba(123,130,176,.22); font-size: .78rem;
  }
  .landing-group-location { color: #aeb9e8; }
  .join-form, .late-arrival {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; margin-top: 1rem; padding: 1.5rem;
  }
  .join-form { display: flex; flex-direction: column; gap: .75rem; }
  .join-form h2 { color: var(--text); font-size: 1.15rem; margin-bottom: 0; }
  .join-form label, .late-arrival label { font-size: .9rem; color: #b5bcdf; }
  .join-help { color: var(--muted); font-size: .88rem; line-height: 1.45; }
  .join-screen button, .join-screen select { min-height: 44px; }
  #join-btn { background: var(--accent); color: #fff; font-size: 1rem; padding: .75rem; margin-top: .15rem; }
  #join-btn:hover { background: #5a7ce6; }
  .late-arrival-form { display: grid; gap: .75rem; margin-top: 1rem; }
  .join-error { color: #ff7777; font-size: .85rem; text-align: left; min-height: 1.2em; }
  .facilitator-entry {
    color: var(--muted); display: flex; justify-content: center; flex-wrap: wrap;
    gap: .4rem; margin-top: 1.5rem; font-size: .88rem;
  }
  .facilitator-entry a { color: #b9c8ff; font-weight: 650; }

  @media (max-width: 600px) {
    .join-screen { padding: 1rem 0 2rem; }
    .join-brand .app-title { font-size: 2rem; }
    .session-hero { padding: 24px; }
    .join-form, .late-arrival { padding: 1.25rem; }
    .session-start-guidance { border-radius: 12px; line-height: 1.4; }
    .landing-group { grid-template-columns: 1fr; }
  }

  /* ---- Participant view ---- */
  .participant-view { margin-bottom: 1.5rem; }

  .location-block {
    background: var(--surface);
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    padding: 1.5rem;
    margin-bottom: 1rem;
    text-align: center;
  }
  .join-btn {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-size: 1.4rem;
    font-weight: 700;
    padding: .85rem 2rem;
    border-radius: var(--radius);
    transition: background .15s;
  }
  .join-btn:hover { background: #5a7ce6; }
  .location-label {
    font-size: 1.5rem; font-weight: 700; color: var(--text);
  }
  .location-instructions {
    font-size: 1rem; color: var(--muted); margin-top: .4rem;
  }

  .group-members {
    font-size: 1rem; color: var(--muted);
    background: var(--surface); border-radius: var(--radius);
    padding: .75rem 1rem; margin-bottom: 1rem;
  }

  .countdown {
    font-size: 3rem; font-weight: 800; text-align: center;
    letter-spacing: .05em; margin-bottom: 1rem; font-variant-numeric: tabular-nums;
  }
  .countdown-normal { color: var(--text); }
  .countdown-amber { color: var(--amber); }
  .countdown-red { color: var(--red); }

  .phase-instructions {
    font-size: 1rem; color: var(--muted);
    background: var(--surface); border-radius: var(--radius);
    padding: .75rem 1rem; margin-bottom: 1rem; line-height: 1.5;
  }

  .phase-transition .location-block {
    animation: flash .5s ease-out;
  }
  @keyframes flash {
    0%   { border-color: #fff; box-shadow: 0 0 20px rgba(255,255,255,.4); }
    100% { border-color: var(--accent); box-shadow: none; }
  }

  /* ---- Timeline ---- */
  .timeline-strip {
    display: flex; gap: .4rem; flex-wrap: wrap;
    margin-bottom: 1rem;
  }
  .timeline-item {
    font-size: .75rem; padding: .25rem .6rem;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 99px; color: var(--muted);
  }
  .timeline-item.active {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .timeline-item.elapsed {
    color: var(--green); border-color: var(--green);
  }

  /* ---- Invitation footer ---- */
  .invitation-footer {
    font-size: .85rem; font-style: italic; color: var(--muted);
    text-align: center; margin-bottom: .75rem;
  }

  /* ---- Notes ---- */
  .notes-label { font-size: .85rem; color: var(--muted); display: block; margin-bottom: .3rem; }
  .notes-area {
    width: 100%; min-height: 120px; background: var(--surface);
    border: 1px solid var(--border); color: var(--text);
    padding: .5rem .75rem; border-radius: var(--radius);
    font-family: inherit; font-size: .9rem; resize: vertical;
  }

  /* ---- Facilitator view ---- */
  .fac-grid { display: flex; flex-direction: column; gap: .75rem; margin-top: 1rem; }
  .fac-phase {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: .75rem 1rem;
    opacity: .6;
  }
  .fac-phase.fac-active { opacity: 1; border-color: var(--accent); }
  .fac-phase.fac-elapsed { opacity: .35; }
  .fac-phase-name { font-weight: 700; margin-bottom: .5rem; color: var(--accent); }
  .fac-countdown { color: var(--amber); font-size: .9rem; }
  .fac-group { font-size: .85rem; color: var(--muted); margin-top: .3rem; }
  .fac-members { color: var(--text); }
  .fac-location a { color: var(--accent); }

  /* ---- Status message ---- */
  .status-message {
    text-align: center; padding: 3rem; font-size: 1.2rem; color: var(--muted);
  }
</style>
</head>
<body>
<nav class="global-navigation" data-role="global-navigation" aria-label="Application navigation">
  <a href="./">Home</a>
  <a href="./" class="start-new-session">Start new session</a>
</nav>
<div id="app"></div>
<script src="vendor/driver.js.iife.js"></script>
<script src="ls-clock-core.js"></script>
<script src="ls-clock.js"></script>
</body>
</html>
